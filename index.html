<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
:root{
  --bg:#EEF0F0; --surface:#F8F9F9; --ink:#1B2226; --ink-2:#4A555C; --line:#CDD3D6;
  --brass:#9C7A43; --brass-text:#7A5B2A; --wood:#9A6B43; --silver:#8E9AA2; --glass:rgba(120,160,180,.22); --on-ink:#F8F9F9;
  --ok:#2F6B4F; --err:#A3392B;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151C1F; --surface:#1C2529; --ink:#E9ECEC; --ink-2:#A9B4B9; --line:#33414A;
    --brass:#C9A56A; --brass-text:#D6B67F; --wood:#B07E52; --silver:#A9B5BC; --glass:rgba(150,190,210,.18); --on-ink:#151C1F;
    --ok:#7FC3A0; --err:#F0907F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151C1F; --surface:#1C2529; --ink:#E9ECEC; --ink-2:#A9B4B9; --line:#33414A;
  --brass:#C9A56A; --brass-text:#D6B67F; --wood:#B07E52; --silver:#A9B5BC; --glass:rgba(150,190,210,.18); --on-ink:#151C1F;
  --ok:#7FC3A0; --err:#F0907F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
html[lang="hi"] body{font-family:"Noto Sans Devanagari",Manrope,sans-serif}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
h1,h2,h3{font-family:Marcellus,"Times New Roman",serif;font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3{font-family:"Tiro Devanagari Hindi",Marcellus,serif;line-height:1.3}
p{margin:0;text-wrap:pretty}
.skip{position:absolute;left:12px;top:-60px;z-index:20;background:var(--ink);color:var(--on-ink);padding:10px 14px;border-radius:6px}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}

/* dark "stage" sections keep their own palette, like a film still */
.stage{--bg:#0E1315;--surface:#161D20;--ink:#ECEFEF;--ink-2:#A9B4B9;--line:#2E3A41;--brass:#C9A56A;--brass-text:#D9BC88;--silver:#A9B5BC;--wood:#B07E52;--on-ink:#0E1315;background:var(--bg);color:var(--ink);position:relative}

/* header */
header.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);transition:background-color .3s,border-color .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0E1315}
header.top.over{background:transparent;border-color:transparent;color:#ECEFEF}
header.top.over .btn-wa{background:#ECEFEF;color:#0E1315}
header.top.over .lang{border-color:rgba(236,239,239,.35);color:#ECEFEF}
header.top.over .brand span{color:#A9B4B9}
header.top.over .btn-ghost{color:#ECEFEF}
.gates-st .pin > .wrap{width:100%}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;line-height:1.1}
.brand b{font-family:Marcellus,serif;font-weight:400;font-size:21px;letter-spacing:.14em}
.brand span{display:block;font-size:12px;color:var(--ink-2);letter-spacing:.06em}
nav.links{display:flex;gap:24px;font-size:14px;font-weight:600}
nav.links a{text-decoration:none;opacity:.78}
nav.links a:hover{opacity:1}
.top-cta{display:flex;gap:8px;align-items:center}
.lang{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;font-weight:600;font-size:14px;font-family:"Noto Sans Devanagari",Manrope,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.lang svg{width:16px;height:16px}
@media (max-width:1020px){nav.links{display:none}}
@media (max-width:560px){.top-cta .btn-call{display:none}.brand span{display:none}.brand b{font-size:18px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;line-height:1;text-decoration:none;border:1px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-wa{background:var(--ink);color:var(--on-ink)}
.btn-wa:hover{background:var(--brass-text);color:var(--on-ink)}
.btn-ghost{border-color:currentColor;color:var(--ink);background:transparent}
.btn-ghost:hover{color:var(--brass-text)}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.btn svg{width:18px;height:18px;flex-shrink:0}

/* ---------- intro: the gate ---------- */
.intro{height:100vh;height:100svh}
.js:not(.rm) .intro{height:270vh}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.intro-photo{position:absolute;inset:0;will-change:clip-path}
.intro-photo img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 60%}
.intro-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,19,21,.92) 0%,rgba(14,19,21,.45) 45%,rgba(14,19,21,.35) 70%,rgba(14,19,21,.6) 100%)}
.intro-glow{position:absolute;inset:0;background:radial-gradient(ellipse 45% 40% at 50% 62%,rgba(217,188,136,.30),transparent 70%);opacity:0;pointer-events:none}
.gate{position:absolute;left:50%;bottom:7vh;height:min(70vh,92vw);aspect-ratio:400/420;transform:translateX(-50%);perspective:1700px;display:none}
.js:not(.rm) .gate{display:block}
.leaf{position:absolute;top:0;width:50%;height:100%;will-change:transform}
.leaf.l{left:0;transform-origin:0 50%}
.leaf.r{right:0;transform-origin:100% 50%}
.leaf svg{display:block;width:100%;height:100%}
.leaf.r svg{transform:scaleX(-1)}
.pillar{position:absolute;bottom:0;width:11%;height:108%;background:linear-gradient(90deg,#20282C,#2C363B 40%,#192024);will-change:transform}
.pillar.l{right:100%}
.pillar.r{left:100%}
.pillar::before{content:"";position:absolute;left:-12%;right:-12%;top:0;height:5%;background:#2E383D;border-bottom:2px solid #C9A56A}
.pillar::after{content:"";position:absolute;left:50%;top:-6%;width:46%;aspect-ratio:1;transform:translateX(-50%);border-radius:50% 50% 8px 8px;background:radial-gradient(circle at 50% 60%,#FFE4AE,#C9A56A 55%,#6E5427);box-shadow:0 0 40px 12px rgba(255,214,150,.28)}
.ground{position:absolute;left:0;right:0;bottom:0;height:7vh;background:linear-gradient(#0E1315,#0A0E10)}
.intro-copy{position:absolute;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom,0px))}
.intro-copy .wrap{max-width:1180px}
.intro-copy h1{font-size:clamp(40px,7.4vw,104px);letter-spacing:.02em;line-height:1}
.intro-copy p{margin-top:18px;font-size:clamp(16px,1.7vw,20px);color:var(--ink-2);max-width:30em}
.intro-copy .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.stage .btn-wa{background:#ECEFEF;color:#0E1315}
.stage .btn-wa:hover{background:#D9BC88}
.cue{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink-2)}
.js:not(.rm) .cue{display:flex}
.cue svg{width:18px;height:18px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
@media (max-aspect-ratio:4/5){.gate{height:min(74vh,150vw);bottom:5vh}}

/* ---------- statement ---------- */
.statement{padding:clamp(80px,14vw,180px) 0}
.statement p{font-family:Marcellus,serif;font-size:clamp(28px,4.6vw,58px);line-height:1.18;max-width:20em}
html[lang="hi"] .statement p{font-family:"Tiro Devanagari Hindi",serif;line-height:1.4}
.statement .w{opacity:.18;transition:opacity .25s linear}
.statement .w.lit{opacity:1}
.rm .statement .w{opacity:1}

/* ---------- sections ---------- */
section.block{padding:clamp(64px,9vw,120px) 0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 32px;margin-bottom:clamp(24px,3.5vw,40px)}
.head h2{font-size:clamp(32px,4.6vw,56px)}
.head p{color:var(--ink-2);max-width:28em}

/* carousel */
.car{display:flex;gap:clamp(12px,1.6vw,20px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px max(clamp(18px,4vw,40px),calc((100vw - 1180px)/2 + 40px)) 8px;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(84vw,640px);scroll-snap-align:center;margin:0;transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .5s;transform:scale(.95);opacity:.55}
.slide.on{transform:none;opacity:1}
.rm .slide{transition:none}
.slide button{all:unset;display:block;cursor:pointer;width:100%;border-radius:14px;overflow:hidden}
.slide button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.slide img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.slide figcaption{margin-top:12px;font-size:15px;color:var(--ink-2)}
.slide.more button{aspect-ratio:4/3;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:28px;box-sizing:border-box}
.slide.more strong{font-family:Marcellus,serif;font-weight:400;font-size:clamp(26px,3vw,36px);line-height:1.15}
.slide.more span{color:var(--ink-2);font-size:15px;margin-top:8px}
.car-ctl{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:28px;height:28px;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.dots button::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .3s,background-color .3s}
.dots button[aria-current="true"]::after{width:22px;border-radius:4px;background:var(--ink)}
.arrows{display:flex;gap:8px}
.arrows button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:22px;line-height:1}
.arrows button:hover{border-color:var(--ink)}
@media (max-width:640px){.arrows{display:none}}

/* category tiles */
.filters{display:flex;gap:8px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,2.4vw,32px) clamp(12px,1.8vw,24px)}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;width:100%}
.tile:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:4px}
.tile .m{display:block;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--surface)}
.tile .m img,.tile .m svg{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile:hover .m img{transform:scale(1.04)}
.tile .n{font-weight:600;font-size:16px;line-height:1.3}
.tile .k{font-size:13px;color:var(--brass-text);font-weight:600;margin-top:-6px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .n{font-size:15px}}

/* ---------- gate levels stage ---------- */
.gates-st{height:auto}
.js:not(.rm) .gates-st{height:420vh}
.gates-st .pin{display:grid;grid-template-rows:auto 1fr auto;padding:calc(84px + env(safe-area-inset-top,0px)) 0 calc(24px + env(safe-area-inset-bottom,0px))}
.rm .gates-st .pin,.gates-st:not(.live) .pin{position:relative;height:auto;padding-bottom:64px}
.gs-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(20px,4vw,56px);align-items:center;min-height:0}
.gs-copy h2{font-size:clamp(28px,3.6vw,46px)}
.gs-copy .hint{color:var(--ink-2);margin-top:10px;font-size:15px}
.gs-tier{margin-top:clamp(18px,3vh,36px)}
.gs-tier .nm{display:flex;align-items:baseline;gap:14px}
.gs-tier .nm strong{font-family:Marcellus,serif;font-weight:400;font-size:clamp(30px,4vw,50px);line-height:1}
html[lang="hi"] .gs-tier .nm strong{font-family:"Tiro Devanagari Hindi",serif}
.gs-tier .band{color:var(--brass-text);font-weight:700;letter-spacing:.1em;font-size:18px}
.gs-tier p{color:var(--ink-2);margin-top:8px}
.gs-tier ul{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.gs-tier li{padding-left:14px;position:relative}
.gs-tier li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;background:var(--brass);transform:rotate(45deg)}
.gs-tier .btn{margin-top:20px}
.gs-art{--ink:#B9C3C8;--line:#2F3B42;position:relative;aspect-ratio:240/160;width:100%;max-height:58vh;justify-self:center}
.gs-art .layer{position:absolute;inset:0;opacity:0;transition:opacity .4s}
.js:not(.rm) .gates-st.live .gs-art .layer{transition:none}
.gs-art .layer.on{opacity:1}
.gs-art svg{display:block;width:100%;height:100%}
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:clamp(16px,3vh,28px)}
.rail button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2);padding:6px 0}
.rail button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.rail button[aria-current="true"]{color:var(--ink)}
.rail i{display:block;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rail i b{display:block;height:100%;width:0;background:var(--brass)}
.rm .rail i b,.gates-st:not(.live) .rail i b{transition:width .3s}
@media (max-width:820px){
  .gs-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;align-content:start;gap:8px}
  .gs-art{order:-1;max-height:30vh;width:auto;height:30vh}
  .gs-copy .hint{display:none}
  .gs-copy h2{font-size:24px}
  .gs-tier{margin-top:10px}
  .gs-tier ul{font-size:13px;margin-top:8px}
  .gs-tier .btn{margin-top:12px}
  .gates-st .pin{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

/* rooftop */
.roof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.roof article{display:flex;flex-direction:column;gap:10px}
.roof .m{aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--surface);margin-bottom:6px}
.roof .m img,.roof .m svg{display:block;width:100%;height:100%;object-fit:cover}
.roof h3{font-size:26px}
.roof p{color:var(--ink-2)}
details.more summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:36px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:18px;line-height:1;color:var(--brass-text)}
details.more[open] summary::after{content:"–"}
details.more ul{margin:4px 0 8px;padding-left:18px;font-size:15px;color:var(--ink-2)}
details.more .mats{font-size:13px;color:var(--brass-text);font-weight:600}
.roof .btn{align-self:flex-start;margin-top:4px}
@media (max-width:860px){.roof{grid-template-columns:minmax(0,1fr)}}

/* how */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,3vw,32px);counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--ink);padding-top:14px}
.steps li::before{content:counter(s);font-family:Marcellus,serif;font-size:30px;color:var(--brass-text);display:block;line-height:1;margin-bottom:10px}
.steps h3{font-size:22px;margin-bottom:4px}
.steps p{font-size:15px;color:var(--ink-2)}
.promise{margin-top:clamp(32px,5vw,52px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,32px);font-size:15px;color:var(--ink-2)}
.promise strong{display:block;color:var(--ink);font-size:16px}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.promise{grid-template-columns:minmax(0,1fr)}}

/* custom form */
.custom{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(28px,5vw,64px);align-items:start}
.custom h2{font-size:clamp(32px,4.6vw,56px)}
.custom .side p{color:var(--ink-2);margin-top:14px;max-width:26em}
form.q{background:var(--surface);border-radius:10px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full,.q details,.q .submit-row,.q .status{grid-column:1/-1}
.f label,.f .lbl{font-size:14px;font-weight:600}
.f input,.f select,.f textarea{font-size:16px;line-height:1.4;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;min-height:48px;width:100%}
.f textarea{min-height:100px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass)}
.q details .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:10px}
.drop{border:1.5px dashed var(--silver);border-radius:8px;padding:18px;text-align:center;cursor:pointer;background:var(--bg);position:relative}
.drop:hover,.drop.over{border-color:var(--brass)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop span{display:block;font-weight:600}
.drop small{color:var(--ink-2);font-size:13px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.thumbs figure{margin:0;position:relative;width:84px;height:84px;border-radius:6px;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);font-size:15px;line-height:1;cursor:pointer}
.err{color:var(--err);font-size:13px}
.status{font-size:14px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);display:none}
.status.show{display:block}
.status.ok{border-color:var(--ok);color:var(--ok)}
.status.bad{border-color:var(--err);color:var(--err)}
.submit-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (max-width:860px){.custom{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){form.q,.q details .grid2{grid-template-columns:minmax(0,1fr)}}

/* about */
