<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azar Engineering Works – Gates, Railings, Rooftops and Interiors</title>
<meta name="description" content="Azar Engineering Works: custom gates, railings, rooftop rooms, sheds, aluminium and glass, wooden furniture, almirahs, racks and false ceilings. Based in Delhi, working across India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
:root{
  --bg:#EEF0F0; --surface:#F8F9F9; --ink:#1B2226; --ink-2:#4A555C; --line:#CDD3D6;
  --brass:#9C7A43; --brass-text:#7A5B2A; --wood:#9A6B43; --silver:#8E9AA2; --glass:rgba(120,160,180,.22); --on-ink:#F8F9F9;
  --ok:#2F6B4F; --err:#A3392B;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#182024; --surface:#1F292E; --ink:#E9ECEC; --ink-2:#A9B4B9; --line:#34424A;
    --brass:#C9A56A; --brass-text:#D6B67F; --wood:#B07E52; --silver:#A9B5BC; --glass:rgba(150,190,210,.18); --on-ink:#182024;
    --ok:#7FC3A0; --err:#F0907F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#182024; --surface:#1F292E; --ink:#E9ECEC; --ink-2:#A9B4B9; --line:#34424A;
  --brass:#C9A56A; --brass-text:#D6B67F; --wood:#B07E52; --silver:#A9B5BC; --glass:rgba(150,190,210,.18); --on-ink:#182024;
  --ok:#7FC3A0; --err:#F0907F;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang="hi"] body{font-family:"Noto Sans Devanagari",Manrope,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
h1,h2,h3{font-family:Marcellus,"Times New Roman",serif;font-weight:400;line-height:1.12;margin:0;text-wrap:balance}
html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3{font-family:"Tiro Devanagari Hindi",Marcellus,serif;line-height:1.35}
p{margin:0;text-wrap:pretty}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand b{font-family:Marcellus,serif;font-weight:400;font-size:21px;letter-spacing:.06em}
.brand span{font-size:12px;color:var(--ink-2);letter-spacing:.04em}
nav.links{display:flex;gap:22px;font-size:14px;font-weight:600}
nav.links a{text-decoration:none;color:var(--ink-2)}
nav.links a:hover{color:var(--ink)}
.top-cta{display:flex;gap:8px;align-items:center}
.lang{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px/1 inherit;font-family:"Noto Sans Devanagari",Manrope,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.lang:hover{border-color:var(--brass)}
.lang svg{width:16px;height:16px}
@media (max-width:980px){nav.links{display:none}}
@media (max-width:560px){.top-cta .btn-call{display:none}.brand span{display:none}.brand b{font-size:18px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;line-height:1;text-decoration:none;border:1px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-wa{background:var(--ink);color:var(--on-ink)}
.btn-wa:hover{background:var(--brass-text)}
.btn-ghost{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-ghost:hover{border-color:var(--brass);color:var(--brass-text)}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px}
.btn svg{width:18px;height:18px;flex-shrink:0}

.hero{padding:clamp(40px,7vw,96px) 0 clamp(48px,7vw,88px)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(36px,6vw,72px);letter-spacing:-.005em}
.hero p.lede{margin-top:22px;font-size:clamp(16px,1.6vw,19px);color:var(--ink-2);max-width:34em}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .note{margin-top:22px;font-size:14px;color:var(--ink-2)}
.hero-art svg{display:block;width:100%;height:auto}
.draw path,.draw line,.draw rect,.draw circle{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.draw path,.draw line,.draw rect,.draw circle{animation:none;stroke-dashoffset:0}}
@media (max-width:820px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.hero-art{max-width:520px}}

section.block{padding:clamp(56px,8vw,104px) 0;border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:clamp(28px,4vw,44px)}
.sec-head h2{font-size:clamp(30px,4vw,48px)}
.sec-head p{color:var(--ink-2);max-width:36em}
@media (max-width:820px){.sec-head{grid-template-columns:minmax(0,1fr)}}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-weight:600;font-size:14px;line-height:1;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.index{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(24px,4vw,56px)}
.index li{display:grid;grid-template-columns:136px minmax(0,1fr);grid-template-rows:auto auto auto 1fr;gap:4px 18px;align-items:start;padding:20px 0;border-bottom:1px solid var(--line)}
.thumb{grid-row:1/5;grid-column:1;width:136px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.thumb svg,.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.index h3{grid-column:2;font-size:21px}
.index p{grid-column:2;font-size:15px;color:var(--ink-2)}
.index .mats{grid-column:2;font-size:13px;color:var(--brass-text);font-weight:600}
.index a.ask{grid-column:2;justify-self:start;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--brass);min-height:40px;display:inline-flex;align-items:flex-end;padding-bottom:2px}
.index a.ask:hover{color:var(--brass-text)}
@media (max-width:980px){.index{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.index li{grid-template-columns:104px minmax(0,1fr);gap:4px 14px}.thumb{width:104px}.index h3{font-size:19px}.index p{font-size:14px}}

.tiers{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;margin-bottom:12px;background:var(--surface)}
.tiers button{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:15px;line-height:1;cursor:pointer;font-family:inherit}
.tiers button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.tier-intro{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;margin:18px 0 26px;color:var(--ink-2)}
.tier-intro strong{font-family:Marcellus,serif;font-weight:400;font-size:24px;color:var(--ink)}
html[lang="hi"] .tier-intro strong{font-family:"Tiro Devanagari Hindi",serif}
.tier-intro .band{color:var(--brass-text);font-weight:700;letter-spacing:.08em}
.gates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,28px)}
.gate{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.gate .art{background:var(--bg);border-bottom:1px solid var(--line);padding:18px 18px 8px}
.gate .art svg{display:block;width:100%;height:auto}
.gate .body{padding:20px;display:flex;flex-direction:column;gap:12px;flex-grow:1}
.gate h3{font-size:23px}
.gate dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.gate dt{color:var(--ink-2)}
.gate dd{margin:0}
.gate .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.disclaim{margin-top:22px;font-size:14px;color:var(--ink-2)}
@media (max-width:980px){.gates{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.gates{grid-template-columns:minmax(0,1fr)}.tiers{width:100%;border-radius:12px}.tiers button{flex:1 1 40%;border-radius:8px}}

.roof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink)}
.roof article{padding:26px clamp(0px,2vw,26px) 8px 0;display:flex;flex-direction:column;gap:12px}
.roof article + article{padding-left:clamp(16px,2vw,26px);border-left:1px solid var(--line)}
.roof .rart{background:var(--surface);border:1px solid var(--line);border-radius:6px;aspect-ratio:4/3;overflow:hidden}
.roof .rart svg,.roof .rart img{display:block;width:100%;height:100%;object-fit:cover}
.roof h3{font-size:26px}
.roof p{color:var(--ink-2);font-size:15px}
.roof ul{margin:0;padding-left:18px;font-size:15px}
.roof .mats{font-size:13px;color:var(--brass-text);font-weight:600}
.roof .btn{align-self:flex-start}
@media (max-width:860px){.roof{grid-template-columns:minmax(0,1fr)}.roof article + article{padding-left:0;border-left:0;border-top:1px solid var(--line)}.roof .rart{max-width:420px}}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,3vw,36px);counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid var(--brass);padding-top:16px}
.steps li::before{content:counter(s);font-family:Marcellus,serif;font-size:34px;color:var(--brass-text);display:block;line-height:1;margin-bottom:12px}
.steps h3{font-size:21px;margin-bottom:8px}
.steps p{font-size:15px;color:var(--ink-2)}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}}
.promise{margin-top:clamp(36px,5vw,56px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,3vw,36px)}
.promise div{font-size:15px;color:var(--ink-2)}
.promise strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
@media (max-width:760px){.promise{grid-template-columns:minmax(0,1fr)}}

.custom{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(28px,5vw,64px);align-items:start}
.custom .side h2{font-size:clamp(30px,4vw,48px)}
.custom .side p{color:var(--ink-2);margin-top:16px}
.custom .side ul{margin:20px 0 0;padding-left:18px;color:var(--ink-2);font-size:15px}
form.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f.full{grid-column:1/-1}
.f label,.f .lbl{font-size:14px;font-weight:600}
.f input,.f select,.f textarea{font:16px/1.4 inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;min-height:46px;width:100%}
.f textarea{min-height:110px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass)}
.drop{border:1.5px dashed var(--silver);border-radius:8px;padding:18px;text-align:center;cursor:pointer;background:var(--bg);position:relative}
.drop:hover,.drop.over{border-color:var(--brass)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop span{display:block;font-weight:600}
.drop small{color:var(--ink-2);font-size:13px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.thumbs figure{margin:0;position:relative;width:84px;height:84px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);font-size:15px;line-height:1;cursor:pointer}
.err{color:var(--err);font-size:13px}
.status{grid-column:1/-1;font-size:14px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);display:none}
.status.show{display:block}
.status.ok{border-color:var(--ok);color:var(--ok)}
.status.bad{border-color:var(--err);color:var(--err)}
.submit-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media (max-width:860px){.custom{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){form.q{grid-template-columns:minmax(0,1fr)}}

.about{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,5vw,64px);align-items:center}
.about h2{font-size:clamp(30px,4vw,48px);margin-bottom:18px}
.about p{color:var(--ink-2);margin-top:12px;max-width:36em}
.about-photo{aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.about-photo img,.about-photo svg{display:block;width:100%;height:100%;object-fit:cover}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.people strong{display:block;font-size:18px}
.people span{display:block;font-size:14px;color:var(--ink-2)}
.people a{font-weight:600;text-decoration:none;border-bottom:1px solid var(--brass)}
@media (max-width:820px){.about{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.people{grid-template-columns:minmax(0,1fr)}}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gallery figure{margin:0}
.gallery img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.gallery figcaption{font-size:14px;color:var(--ink-2);margin-top:6px}
@media (max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}

.gallery button.ph{all:unset;cursor:pointer;display:block;border-radius:6px}
.gallery button.ph:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.see-all{margin-top:22px}
.gdlg,.viewer{border:0;padding:0;max-width:100vw;max-height:100vh;width:100vw;height:100%;margin:0;background:var(--bg);color:var(--ink)}
.gdlg::backdrop,.viewer::backdrop{background:rgba(0,0,0,.6)}
.gdlg{padding:calc(16px + env(safe-area-inset-top,0px)) clamp(16px,4vw,40px) calc(24px + env(safe-area-inset-bottom,0px))}
.gdlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:1}
.gdlg-head h2{font-size:clamp(24px,3vw,34px)}
.gallery.all{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.gallery.all{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.gallery.all figcaption{display:none}}
.viewer{display:none;flex-direction:column;background:#0E1214;color:#E9ECEC}
.viewer[open]{display:flex}
.vbar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;font-size:14px}
.viewer .btn-ghost{color:#E9ECEC;border-color:#E9ECEC}
.vstage{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:0;padding:0 8px}
.vstage img{max-width:100%;max-height:100%;object-fit:contain;min-width:0}
.vnav{flex-shrink:0;width:48px;height:48px;border-radius:50%;border:1px solid rgba(233,236,236,.4);background:transparent;color:#E9ECEC;font-size:28px;line-height:1;cursor:pointer}
.vcap{text-align:center;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));font-size:15px;min-height:1em}
@media (max-width:600px){.vnav{display:none}}

.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,3vw,36px)}
.contact h3{font-size:22px;margin-bottom:10px}
.contact a{text-decoration:none;border-bottom:1px solid var(--line)}
.contact a:hover{border-color:var(--brass)}
@media (max-width:760px){.contact{grid-template-columns:minmax(0,1fr)}}
footer{border-top:1px solid var(--line);padding:28px 0 calc(28px + 64px);font-size:14px;color:var(--ink-2)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
@media (min-width:761px){footer{padding-bottom:28px}}

.mbar{display:none}
@media (max-width:760px){
  .mbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
  .mbar .btn{width:100%}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Azar Engineering Works">
      <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="3" style="fill:var(--ink)"/><rect x="7" y="7" width="20" height="4" style="fill:var(--brass)"/><rect x="15" y="11" width="4" height="12" style="fill:var(--bg)"/><rect x="7" y="23" width="20" height="4" style="fill:var(--brass)"/></svg>
      <div><b>AZAR</b><br><span>Engineering Works</span></div>
    </a>
    <nav class="links" aria-label="Sections">
      <a href="#work" data-i="nav_work"></a>
      <a href="#gates" data-i="nav_gates"></a>
      <a href="#rooftop" data-i="nav_roof"></a>
      <a href="#custom" data-i="nav_custom"></a>
      <a href="#about" data-i="nav_about"></a>
      <a href="#contact" data-i="nav_contact"></a>
    </nav>
    <div class="top-cta">
      <button type="button" class="lang" id="langBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
        <span id="langLabel"></span>
      </button>
      <a class="btn btn-ghost btn-sm btn-call" href="tel:+918287543072" data-i="call"></a>
      <a class="btn btn-wa btn-sm js-wa" data-w="msg_generic" href="https://wa.me/918287543072" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <h1 data-i="hero_h"></h1>
        <p class="lede" data-i="hero_p"></p>
        <div class="actions">
          <a class="btn btn-wa js-wa" data-w="msg_hero" href="https://wa.me/918287543072" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg>

    show(files.length ? t('s_open_files') : t('s_open'), 'ok');
  }

  renderAll();
})();
</script>
